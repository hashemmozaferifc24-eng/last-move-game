<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آخرین حرکت | LAST MOVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:tahoma;text-align:center;padding:18px}
h1{color:#ffd34e;margin:10px}
.info{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px}
.info span{background:#222e42;padding:12px;border-radius:10px}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:360px;margin:20px auto}
.cell{aspect-ratio:1;background:#29364b;border:1px solid #50617b;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:25px}
.wall{background:#111}
.player{background:#1261a0}
.goal{background:#6a5210}
button{background:#e9b93e;color:#171717;border:0;border-radius:10px;padding:13px 20px;font-size:18px;font-weight:bold;margin:5px}
.controls{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:7px;margin-top:20px}
.controls button{padding:12px;font-size:23px}
#message{min-height:30px;color:#ffd34e;margin:15px}
</style>
</head>
<body>

<h1>⭐ آخرین حرکت ⭐</h1>
<p>مهره آبی را به ستاره برسان؛ مراقب مین‌ها باش!</p>

<div class="info">
<span>مرحله: <b id="level">1</b></span>
<span>حرکت باقی‌مانده: <b id="moves">0</b></span>
<span>جان: <b id="lives">❤️❤️❤️</b></span>
</div>

<div id="board"></div>
<div id="message">با دکمه‌ها حرکت کن.</div>

<div class="controls">
<div></div><button onclick="move(-1,0)">⬆️</button><div></div>
<button onclick="move(0,1)">➡️</button>
<button onclick="move(1,0)">⬇️</button>
<button onclick="move(0,-1)">⬅️</button>
</div>

<button onclick="restart()">شروع دوباره</button>

<script>
const levels=[
{start:[4,0],goal:[0,4],wall:[[2,2]],mines:[[1,1],[3,3]],max:10},
{start:[4,0],goal:[0,4],wall:[[2,1],[2,3]],mines:[[1,2],[3,2],[4,3]],max:11},
{start:[4,0],goal:[0,4],wall:[[2,1],[2,2],[2,3]],mines:[[1,1],[1,3],[3,1],[3,3]],max:12},
{start:[4,0],goal:[0,4],wall:[[1,2],[2,2],[3,2]],mines:[[1,1],[1,4],[3,1],[3,4]],max:12},
{start:[4,0],goal:[0,4],wall:[[3,2]],mines:[[4,1],[1,1],[2,3],[3,4]],max:10}
];

let stage=0,row=0,col=0,moves=0,lives=3,finished=false;

function load(){
let L=levels[stage];
row=L.start[0];col=L.start[1];
moves=L.max;finished=false;
document.getElementById("message").textContent="مراقب مین‌ها باش!";
draw();
}

function draw(){
let L=levels[stage];
document.getElementById("level").textContent=stage+1;
document.getElementById("moves").textContent=moves;
document.getElementById("lives").textContent="❤️".repeat(lives);
let board=document.getElementById("board");
board.innerHTML="";
for(let r=0;r<5;r++){
for(let c=0;c<5;c++){
let cell=document.createElement("div");
cell.className="cell";
if(L.wall.some(p=>p[0]===r&&p[1]===c)){
cell.classList.add("wall");cell.textContent="🧱";
}
if(L.goal[0]===r&&L.goal[1]===c){
cell.classList.add("goal");cell.textContent="⭐";
}
if(row===r&&col===c){
cell.classList.add("player");cell.textContent="🔵";
}
board.appendChild(cell);
}
}
}

function move(dr,dc){
if(finished)return;
let nr=row+dr,nc=col+dc,L=levels[stage];
if(nr<0||nr>4||nc<0||nc>4)return;
if(L.wall.some(p=>p[0]===nr&&p[1]===nc)){
document.getElementById("message").textContent="راه بسته است! 🧱";
return;
}
row=nr;col=nc;moves--;

if(L.mines.some(p=>p[0]===row&&p[1]===col)){
lives--;
document.getElementById("message").textContent="💥 مین بود! یک جان از دست دادی.";
row=L.start[0];col=L.start[1];
if(lives<=0){
finished=true;
document.getElementById("message").textContent="جان‌ها تمام شد! دوباره شروع کن.";
}
}else if(row===L.goal[0]&&col===L.goal[1]){
finished=true;
document.getElementById("message").textContent="🎉 آفرین! مرحله رو بردی!";
setTimeout(()=>{
if(stage<levels.length-1){
stage++;load();
}else{
document.getElementById("message").textContent="🏆 قهرمان شدی! همه مراحل رو بردی!";
}
},1200);
}else if(moves<=0){
finished=true;
document.getElementById("message").textContent="حرکت‌ها تمام شد! دوباره تلاش کن.";
}
draw();
}

function restart(){
lives=3;
load();
}

document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp")move(-1,0);
if(e.key==="ArrowDown")move(1,0);
if(e.key==="ArrowLeft")move(0,-1);
if(e.key==="ArrowRight")move(0,1);
});

load();
</script>
</body>
</html>
